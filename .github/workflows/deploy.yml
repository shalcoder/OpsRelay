name: Deploy OpsRelay

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: opsrelay-frontend-704932818996
  API_FUNCTION_NAME: opsrelay-api
  API_URL: https://4q0wc7pbk4.execute-api.ap-south-1.amazonaws.com/prod
  DEPLOY_ROLE_ARN: arn:aws:iam::704932818996:role/opsrelay-github-deploy-role

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Run Tests
  # ─────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          PYTHONPATH: api:.
        run: pytest api/tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy existing production Lambda
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Lambda)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      api-url: ${{ env.API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and update API Lambda
        run: |
          cd api
          zip -r ../opsrelay-api.zip . -x "__pycache__/*" "*.pyc"
          cd ..
          aws lambda update-function-code \
            --function-name ${{ env.API_FUNCTION_NAME }} \
            --zip-file fileb://opsrelay-api.zip \
            --region ${{ env.AWS_REGION }}

  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend to S3
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (S3)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write production config.js
        run: |
          API_URL="${{ needs.deploy-backend.outputs.api-url }}"
          cat > frontend/config.js <<EOF
          // OpsRelay Production Configuration
          // Auto-generated by GitHub Actions — do not edit manually
          window.OPSR_CONFIG = {
            apiBaseUrl: '${API_URL}/api',
            region: '${{ env.AWS_REGION }}',
            environment: 'production',
            cognito: {
              userPoolId: 'ap-south-1_8RwKqg1pG',
              clientId: '3b5g8ubijpcdg032lhmdouc9is',
              endpoint: 'https://cognito-idp.ap-south-1.amazonaws.com'
            }
          };
          EOF
          echo "config.js written with API URL: $API_URL"

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ env.S3_BUCKET }}/ \
            --region ${{ env.AWS_REGION }} \
            --cache-control "max-age=86400" \
            --exclude "*.html"

          # HTML files — no cache (always fresh)
          aws s3 sync frontend/ s3://${{ env.S3_BUCKET }}/ \
            --region ${{ env.AWS_REGION }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Print deployment summary
        run: |
          echo "========================================"
          echo "  OpsRelay Deployment Complete"
          echo "========================================"
          echo "  API URL : ${{ needs.deploy-backend.outputs.api-url }}"
          echo "  Frontend: http://${{ env.S3_BUCKET }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"
          echo "========================================"

  # ─────────────────────────────────────────────────────────
  # JOB 4: Smoke Test — verify the live API responds
  # ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Smoke test - frontend endpoint
        run: |
          curl -sf "http://${{ env.S3_BUCKET }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com/" > /dev/null
          echo "Smoke test PASSED"
