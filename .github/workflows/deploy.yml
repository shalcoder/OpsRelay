name: Deploy OpsRelay

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: opsrelay-frontend-704932818996
  SAM_STACK_NAME: opsrelay-stack

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Run Tests
  # ─────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ─────────────────────────────────────────────────────────
  # JOB 2: Build & Deploy Backend (SAM)
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (SAM)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      api-url: ${{ steps.get-outputs.outputs.api-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: sam build --use-container

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3

      - name: Get API Gateway URL from CloudFormation outputs
        id: get-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api-url=$API_URL" >> $GITHUB_OUTPUT
          echo "API URL: $API_URL"

  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend to S3
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (S3)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write production config.js
        run: |
          API_URL="${{ needs.deploy-backend.outputs.api-url }}"
          cat > frontend/config.js <<EOF
          // OpsRelay Production Configuration
          // Auto-generated by GitHub Actions — do not edit manually
          window.OPSR_CONFIG = {
            apiBaseUrl: '${API_URL}/api',
            region: '${{ env.AWS_REGION }}',
            environment: 'production'
          };
          EOF
          echo "config.js written with API URL: $API_URL"

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ env.S3_BUCKET }}/ \
            --region ${{ env.AWS_REGION }} \
            --delete \
            --cache-control "max-age=86400" \
            --exclude "*.html"

          # HTML files — no cache (always fresh)
          aws s3 sync frontend/ s3://${{ env.S3_BUCKET }}/ \
            --region ${{ env.AWS_REGION }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache (if configured)
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Print deployment summary
        run: |
          echo "========================================"
          echo "  OpsRelay Deployment Complete"
          echo "========================================"
          echo "  API URL : ${{ needs.deploy-backend.outputs.api-url }}"
          echo "  Frontend: http://${{ env.S3_BUCKET }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"
          echo "========================================"

  # ─────────────────────────────────────────────────────────
  # JOB 4: Smoke Test — verify the live API responds
  # ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for API to warm up
        run: sleep 10

      - name: Smoke test - dashboard endpoint
        run: |
          API_URL="${{ needs.deploy-backend.outputs.api-url }}"
          echo "Testing: $API_URL/api/dashboard"
          RESPONSE=$(curl -sf "$API_URL/api/dashboard" -w "\n%{http_code}" || echo "000")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "SMOKE TEST FAILED — Expected 200, got $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke test PASSED"

      - name: Smoke test - machines endpoint
        run: |
          API_URL="${{ needs.deploy-backend.outputs.api-url }}"
          curl -sf "$API_URL/api/machines" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(f'Machines returned: {len(data)}')
          assert len(data) > 0, 'No machines found!'
          print('PASSED')
          "
